# Prism Therapy — prismtherapyatx.com
# Static site, no build step. Functions in netlify/functions (lead form -> HighLevel).
[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
